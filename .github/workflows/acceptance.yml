name: Public Homebrew acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upgrade_from_commit:
        description: Optional previous tap commit for a real CLI upgrade (before retirement)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: homebrew-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install, upgrade and uninstall (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      # This action checks out the tested commit as the tap on the runner.
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          stable: true
      - name: Upgrade an actual previous CLI release
        if: inputs.upgrade_from_commit != ''
        shell: bash
        env:
          PREVIOUS_COMMIT: ${{ inputs.upgrade_from_commit }}
        run: |
          set -euo pipefail
          [[ "$PREVIOUS_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "$PREVIOUS_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$PREVIOUS_COMMIT"
          current_recipe="$(mktemp)"
          cp Formula/zel.rb "$current_recipe"
          trap 'cp "$current_recipe" Formula/zel.rb; rm -f "$current_recipe"' EXIT
          version_of() { sed -n 's/^  version "\([0-9A-Za-z.-]*\)"$/\1/p' "$1"; }
          current_version="$(version_of "$current_recipe")"
          git show "$PREVIOUS_COMMIT:Formula/zel.rb" > Formula/zel.rb
          previous_version="$(version_of Formula/zel.rb)"
          test -n "$current_version" && test -n "$previous_version"
          test "$previous_version" != "$current_version"
          brew install mylife-inc/tap/zel
          prefix="$(brew --prefix mylife-inc/tap/zel)"
          test "$("$prefix/bin/zel" --version)" = "zel $previous_version"
          brew test mylife-inc/tap/zel
          cp "$current_recipe" Formula/zel.rb
          brew upgrade mylife-inc/tap/zel
          prefix="$(brew --prefix mylife-inc/tap/zel)"
          test "$("$prefix/bin/zel" --version)" = "zel $current_version"
          brew test mylife-inc/tap/zel
          echo "Verified actual CLI upgrade: $previous_version to $current_version"
      - name: Install the public archive and verify the formula
        shell: bash
        run: |
          set -euo pipefail
          brew install mylife-inc/tap/zel
          prefix="$(brew --prefix mylife-inc/tap/zel)"
          test "$(cat "$prefix/share/zel/installation-manager")" = homebrew
          for file in etc/bash_completion.d/zel share/zsh/site-functions/_zel share/fish/vendor_completions.d/zel.fish; do
            test -s "$prefix/$file"
          done
          brew test mylife-inc/tap/zel
      - name: Exercise a formula revision upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('Formula/zel.rb')
          text = p.read_text()
          assert '  revision ' not in text
          lines = text.splitlines(keepends=True)
          index = next(i for i, line in enumerate(lines) if line.startswith('  version "'))
          lines.insert(index + 1, '  revision 1\n')
          p.write_text(''.join(lines))
          PYTHON
          brew upgrade mylife-inc/tap/zel
          brew list --versions mylife-inc/tap/zel | grep -E '_1($| )'
          brew test mylife-inc/tap/zel
      - name: Uninstall
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          brew uninstall --force mylife-inc/tap/zel
          test ! -e "$(brew --prefix)/bin/zel"
